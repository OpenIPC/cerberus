name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: on pull requests a newer push cancels the older run; on master it waits
# instead (only the newest waits), so a release is never cut off between deleting the old "latest"
# and creating the new one. A manual run shares the push group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Pull requests: a change to src/, the installers, the Makefile or ci/ comes with a new
  # CERBERUS_VERSION (MAJOR.MINOR.PATCH) and its CHANGELOG.md section (#33). The checkout is the
  # merge commit; its first parent is the base it was made from.
  version:
    name: version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/check-version.sh HEAD^1

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    # The installers run under BusyBox ash on the camera, where nobody watches them fail. The init
    # script is text inside the binary now, so it is linted as the binary writes it: built here, on
    # the runner, rather than left to the test image, where a missing shellcheck is only a skip.
    # SC2155: `export X="$(fw_printenv ...)"` masking the exit status is the point — a key that is
    # not set is simply empty.
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh uninstall.sh ci/build.sh ci/assemble.sh tests/run.sh tests/suite.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmbedtls-dev
      - run: make -C src
      - run: src/cerberus init-script - | shellcheck -S warning -e SC2155 -s sh -

  test:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Both mbedTLS generations are in the field: 3.x on current distros and in Alpine, 2.28 LTS in
    # Buildroot-era firmware — and Debian bookworm carries exactly that. The suite builds with -Werror,
    # enrols against a fake coordinator over real TLS, walks the streq_* -> cerberus_* migration and the
    # installer, and brings up a real WireGuard tunnel to a hub in its own netns; REQUIRE_WG turns a
    # runner without kernel WireGuard into a failure instead of a silently skipped section.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: musl, mbedTLS 3.x
            image: alpine:3.22
          - name: glibc, mbedTLS 2.28
            image: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: tests/run.sh
        env:
          CERBERUS_TEST_IMAGE: ${{ matrix.image }}
          REQUIRE_WG: '1'

  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    # One static musl binary per CPU architecture, which is what a camera's installer downloads. The
    # script asserts the ELF machine and static linking, and then runs the binary under QEMU and
    # checks its X25519 key against `wg pubkey` — a binary for the right machine can still die on its
    # first instruction, and only running it shows that.
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, mipsel, aarch64, x86_64]
    steps:
      # The version compiled into the binary is CERBERUS_VERSION in src/cerberus.c.
      - uses: actions/checkout@v4

      - name: Toolchain and mbedTLS cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: toolchain-${{ matrix.arch }}-${{ hashFiles('ci/build.sh') }}

      - name: Build
        run: ci/build.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-${{ matrix.arch }}
          path: dist/cerberus-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: release
    # The one release, "latest" (#32): published from master when CERBERUS_VERSION differs from the
    # version in the title of the current "latest", with the binaries that were just built and tested
    # (the same files, not a rebuild), the installer, the uninstaller (a wrapper around it), the license
    # and SHA256SUMS over all of them. Asset names carry no version: cameras fetch
    # releases/latest/download/<name>. A push without a new version publishes nothing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: A new version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^#define CERBERUS_VERSION "\([^"]*\)"[[:space:]]*$/\1/p' src/cerberus.c)
          [ "$(printf '%s\n' "$ver" | grep -c .)" = 1 ] || { echo "::error::expected one CERBERUS_VERSION"; exit 1; }
          # "Not found" means there is no "latest" yet; any other failure stops here.
          if prev=$(gh release view latest --repo "$GITHUB_REPOSITORY" --json name -q .name 2>err.txt); then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          elif grep -qi 'not found' err.txt; then
            prev=""
            echo "exists=0" >> "$GITHUB_OUTPUT"
          else
            cat err.txt; echo "::error::cannot read the current \"latest\" release"; exit 1
          fi
          echo "latest is \"${prev:-none}\", src/cerberus.c says $ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          [ "$prev" = "Cerberus $ver" ] || echo "new=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          pattern: cerberus-*
          path: dist
          merge-multiple: true

      - name: The binaries were built as this version
        if: steps.ver.outputs.new == 'true'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          chmod +x dist/cerberus-*
          got=$(dist/cerberus-x86_64 --help 2>&1 | head -1 | cut -d' ' -f2)
          echo "binary says $got, src/cerberus.c says $VER"
          [ "$got" = "$VER" ]

      - name: Lay out the release
        if: steps.ver.outputs.new == 'true'
        run: ci/assemble.sh

      - name: Publish
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
          EXISTS: ${{ steps.ver.outputs.exists }}
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cat > notes.md <<NOTES
          Cerberus ${VER} (\`${GITHUB_SHA::7}\`): static binaries for arm, mipsel, aarch64 and x86_64, the installer and \`SHA256SUMS\`.

          Install: \`curl -fsSL ${url}/releases/latest/download/install.sh | sh -s -- <token>\`. Changes: [CHANGELOG.md](${url}/blob/master/CHANGELOG.md); details: [README](${url}#readme).
          NOTES
          if [ "$EXISTS" = 1 ]; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create latest dist/* --repo "$GITHUB_REPOSITORY" --latest \
            --target "$GITHUB_SHA" --title "Cerberus ${VER}" --notes-file notes.md
