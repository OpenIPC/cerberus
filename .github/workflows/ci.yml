name: ci

on:
  push:
    branches: [master]
  pull_request:
    # labeled / unlabeled: the version check reads the no-release label
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: on pull requests a newer push cancels the older run; on master it waits
# instead (only the newest waits), so a release is never cut off halfway. A manual run shares the
# push group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Pull requests: a change to src/, the installers, the Makefile or ci/ comes with a new
  # CERBERUS_VERSION (MAJOR.MINOR.PATCH) and its CHANGELOG.md section (#33). The checkout is the
  # merge commit; its first parent is the base it was made from.
  version:
    name: version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/check-version.sh HEAD^1
        env:
          # a change that leaves the binaries as they are may skip the new version
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    # The installers run under BusyBox ash on the camera, where nobody watches them fail. The init
    # script is text inside the binary now, so it is linted as the binary writes it: built here, on
    # the runner, rather than left to the test image, where a missing shellcheck is only a skip.
    # SC2155: `export X="$(fw_printenv ...)"` masking the exit status is the point — a key that is
    # not set is simply empty.
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh uninstall.sh ci/build.sh ci/assemble.sh tests/run.sh tests/suite.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmbedtls-dev
      - run: make -C src
      - run: src/cerberus init-script - | shellcheck -S warning -e SC2155 -s sh -

  test:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Both mbedTLS generations are in the field: 3.x on current distros and in Alpine, 2.28 LTS in
    # Buildroot-era firmware — and Debian bookworm carries exactly that. The suite builds with -Werror,
    # enrols against a fake coordinator over real TLS, walks the streq_* -> cerberus_* migration and the
    # installer, and brings up a real WireGuard tunnel to a hub in its own netns; REQUIRE_WG turns a
    # runner without kernel WireGuard into a failure instead of a silently skipped section.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: musl, mbedTLS 3.x
            image: alpine:3.22
          - name: glibc, mbedTLS 2.28
            image: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: tests/run.sh
        env:
          CERBERUS_TEST_IMAGE: ${{ matrix.image }}
          REQUIRE_WG: '1'

  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    # One static musl binary per CPU architecture, which is what a camera's installer downloads. The
    # script asserts the ELF machine and static linking, and then runs the binary under QEMU and
    # checks its X25519 key against `wg pubkey` — a binary for the right machine can still die on its
    # first instruction, and only running it shows that.
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, mipsel, aarch64, x86_64]
    steps:
      # The version compiled into the binary is CERBERUS_VERSION in src/cerberus.c.
      - uses: actions/checkout@v4

      - name: Toolchain and mbedTLS cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: toolchain-${{ matrix.arch }}-${{ hashFiles('ci/build.sh') }}

      - name: Build
        run: ci/build.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-${{ matrix.arch }}
          path: dist/cerberus-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: release
    # The one release, "latest" (#32): published from master when CERBERUS_VERSION differs from the
    # version in the title of the current "latest", with the binaries that were just built and tested
    # (the same files, not a rebuild), the installer, the uninstaller (a wrapper around it), the license
    # and SHA256SUMS over all of them. Asset names carry no version: cameras fetch
    # releases/latest/download/<name>, so "latest" is updated in place, never deleted: the files are
    # replaced, the tag is moved to the built commit, then the title and notes follow. A push without
    # a new version publishes nothing, and only the head of master is published.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: A new version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the head of master: a rerun of an older run must not roll the cameras back.
          head=$(git ls-remote origin refs/heads/master | cut -f 1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::master is at ${head:0:7} now, not ${GITHUB_SHA::7}: not published"; exit 0
          fi
          ver=$(sed -n 's/^#define CERBERUS_VERSION "\([^"]*\)"[[:space:]]*$/\1/p' src/cerberus.c)
          [ "$(printf '%s\n' "$ver" | grep -c .)" = 1 ] || { echo "::error::expected one CERBERUS_VERSION"; exit 1; }
          # "Not found" means there is no "latest" yet; any other failure stops here.
          if prev=$(gh release view latest --repo "$GITHUB_REPOSITORY" --json name -q .name 2>err.txt); then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          elif grep -qi 'not found' err.txt; then
            prev=""
            echo "exists=0" >> "$GITHUB_OUTPUT"
          else
            cat err.txt; echo "::error::cannot read the current \"latest\" release"; exit 1
          fi
          echo "latest is \"${prev:-none}\", src/cerberus.c says $ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if [ "$prev" != "Cerberus $ver" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "announce=true" >> "$GITHUB_OUTPUT"   # a new version: Telegram (#34)
          else
            # same version: publish again only if a publication was cut off and files are missing
            have=$(gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            for f in cerberus-arm cerberus-mipsel cerberus-aarch64 cerberus-x86_64 install.sh uninstall.sh LICENSE.md SHA256SUMS; do
              printf '%s\n' "$have" | grep -qx "$f" || { echo "latest lacks $f: publishing again"; echo "new=true" >> "$GITHUB_OUTPUT"; break; }
            done
          fi

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          pattern: cerberus-*
          path: dist
          merge-multiple: true

      - name: The binaries were built as this version
        if: steps.ver.outputs.new == 'true'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          chmod +x dist/cerberus-*
          got=$(dist/cerberus-x86_64 --help 2>&1 | head -1 | cut -d' ' -f2)
          echo "binary says $got, src/cerberus.c says $VER"
          [ "$got" = "$VER" ]

      - name: Lay out the release
        if: steps.ver.outputs.new == 'true'
        run: ci/assemble.sh

      - name: Publish
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
          EXISTS: ${{ steps.ver.outputs.exists }}
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cat > notes.md <<NOTES
          Cerberus ${VER} (\`${GITHUB_SHA::7}\`): static binaries for arm, mipsel, aarch64 and x86_64, the installer and \`SHA256SUMS\`.

          Install: \`curl -fsSL ${url}/releases/latest/download/install.sh | sh -s -- <token>\`. Changes: [CHANGELOG.md](${url}/blob/master/CHANGELOG.md); details: [README](${url}#readme).
          NOTES
          if [ "$EXISTS" = 1 ]; then
            # in place: files first, then the tag, then the title and notes
            gh release upload latest dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest --repo "$GITHUB_REPOSITORY" --latest --title "Cerberus ${VER}" --notes-file notes.md
          else
            # a "latest" tag left without its release would keep its old commit under --target:
            # move it (a failure stops the job), or create the release when there is no such tag
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release create latest dist/* --repo "$GITHUB_REPOSITORY" --latest \
              --target "$GITHUB_SHA" --title "Cerberus ${VER}" --notes-file notes.md
          fi

      # A new version (not a re-publication of the same one) goes to the OpenIPC Telegram dev
      # channel (#34). Organization secrets; a failed post is a warning, not a failed release.
      - name: Telegram
        if: steps.ver.outputs.announce == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN_BOT_OPENIPC }}
          TG_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_OPENIPC_DEV }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHANNEL" ]; then
            echo "::warning::Telegram secrets are not available, version not announced"; exit 0
          fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # the CHANGELOG.md section of this version, without its heading
          # (one awk, no pipe: under pipefail a head closing the pipe early would fail the step)
          changes=$(awk -v h="## ${VER} — " 'index($0, h) == 1 {f = 1; next} /^## / && f {exit}
            f && (s || $0 != "") {s = 1; if (++n > 15) exit; print}' CHANGELOG.md)
          # Telegram takes 4096 characters per message: keep the excerpt well below that
          [ "${#changes}" -le 3000 ] || changes="${changes:0:3000}…"
          text=$(printf 'Cerberus %s\nCommit: %s\nTime: %s\n\n%s\n\nInstall: curl -fsSL %s/releases/latest/download/install.sh | sh -s -- <token>\n%s/releases/latest' \
            "$VER" "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "$changes" "$url" "$url")
          HTTP=$(curl -sS -o tg.json -w '%{http_code}' "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHANNEL}" --data-urlencode "text=${text}" \
            --data "disable_web_page_preview=true") || HTTP=000
          echo "Telegram response: $HTTP"
          [ "$HTTP" = 200 ] || echo "::warning::Telegram post failed (HTTP $HTTP)"
